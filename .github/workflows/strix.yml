name: strix-cloud-scan
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ "v*" ]

jobs:
  strix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash
      - name: Strix Cloud Quick Scan (diff-scoped)
        env:
          STRIX_API_KEY: ${{ secrets.STRIX_API_KEY }}
        run: |
          export PATH="$HOME/.strix/bin:$PATH"
          strix cloud scans start --source . --yes --wait --scan-mode quick --scope-mode diff
          strix cloud vulns list --severity critical --fail-on-found || true
